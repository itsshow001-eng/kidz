schema_version: "1.1"
name: info-post-for-daycare-staff
expected_outcome: |
  어린이집 재롱잔치 공연 섭외를 주제로 한 정보글 초안이 나온다.
  제목 앞쪽에 어린이집·재롱잔치 같은 검색어가 있고, 실용적인 체크리스트(5개 안팎)가 있다.
  출처 없는 통계나 지어낸 실적·기업명이 없고, 마크다운 기호가 없는 일반 텍스트다.
  마무리에 이츠쇼컴퍼니 문의 안내(전화·이메일 등)가 있고, 용어는 '~아트', '콜라보 공연' 표기를 따른다.
  광고보다 도움이 되는 글이어야 한다.
