schema_version: "1.1"
name: upcoming-show-preview
context:
  scaffold_script: place-files.sh
expected_outcome: |
  11월 14일 천안 지자체 축제의 벌룬+버블 콜라보 공연을 알리는 예정 공연 안내글 초안이 나온다.
  "준비하고 있어요", "진행할 예정이에요" 같은 예정형으로 쓰이고 이미 한 것처럼 쓰지 않는다.
  ERP 메모의 준비 내용(야외 무대 30분씩 2회, 벌룬 만들기 체험 코너, 날씨에 따라 실내로 변경 가능)이 반영된다.
  연락처와 금액은 없고, 다른 일정(완료·취소·12월)은 쓰이지 않는다.
  글의 맨 끝쪽에 문의처(전화·이메일)가 있고 마크다운 기호가 없다.
  (샘플 데이터는 가짜이며 실제 고객 정보가 아니다.)
